
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.helloworldnativec'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.helloworldnativec'

        minSdk 23
        targetSdk 35

        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    ndkVersion '27.0.12077973'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
